services:
  postgres:
    image: postgres:17-alpine
    container_name: timelines-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timelines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timelines_dev}
      POSTGRES_DB: ${POSTGRES_DB:-timelines}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timelines_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timelines} -d ${POSTGRES_DB:-timelines}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timelines_pgdata:
